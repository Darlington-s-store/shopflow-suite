<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clear ShopFlow LocalStorage</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
            padding: 40px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 40px;
        }

        h1 {
            color: #1a202c;
            font-size: 28px;
            margin-bottom: 10px;
        }

        p {
            color: #718096;
            font-size: 16px;
            line-height: 1.6;
        }

        .stats {
            background: #f7fafc;
            border-radius: 12px;
            padding: 20px;
            margin: 30px 0;
        }

        .stat-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #e2e8f0;
        }

        .stat-item:last-child {
            border-bottom: none;
        }

        .stat-label {
            color: #4a5568;
            font-weight: 500;
        }

        .stat-value {
            color: #667eea;
            font-weight: 600;
        }

        .buttons {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }

        button {
            flex: 1;
            padding: 14px 28px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-clear {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-clear:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .btn-refresh {
            background: #e2e8f0;
            color: #4a5568;
        }

        .btn-refresh:hover {
            background: #cbd5e0;
        }

        .alert {
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            display: none;
        }

        .alert.success {
            background: #c6f6d5;
            color: #22543d;
            border: 1px solid #9ae6b4;
        }

        .alert.info {
            background: #bee3f8;
            color: #2c5282;
            border: 1px solid #90cdf4;
        }

        .keys-list {
            max-height: 200px;
            overflow-y: auto;
            background: #f7fafc;
            border-radius: 8px;
            padding: 15px;
            margin-top: 20px;
        }

        .key-item {
            padding: 8px;
            background: white;
            border-radius: 4px;
            margin-bottom: 8px;
            font-size: 14px;
            font-family: 'Courier New', monospace;
            color: #4a5568;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #a0aec0;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <div class="icon">🧹</div>
            <h1>ShopFlow LocalStorage Cleaner</h1>
            <p>Clear old localStorage data and sync with backend database</p>
        </div>

        <div class="stats">
            <div class="stat-item">
                <span class="stat-label">Total localStorage Keys</span>
                <span class="stat-value" id="totalKeys">0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">ShopFlow Keys</span>
                <span class="stat-value" id="shopflowKeys">0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">Data Size</span>
                <span class="stat-value" id="dataSize">0 KB</span>
            </div>
        </div>

        <div id="keysList" class="keys-list"></div>

        <div class="buttons">
            <button class="btn-refresh" onclick="loadStats()">🔄 Refresh</button>
            <button class="btn-clear" onclick="clearShopflowData()">🗑️ Clear All Data</button>
        </div>

        <div id="alert" class="alert"></div>
    </div>

    <script>
        const SHOPFLOW_PREFIXES = ['shopflow_', 'techmart_'];

        function getShopflowKeys() {
            const keys = [];
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (SHOPFLOW_PREFIXES.some(prefix => key.startsWith(prefix))) {
                    keys.push(key);
                }
            }
            return keys;
        }

        function calculateSize() {
            let size = 0;
            const shopflowKeys = getShopflowKeys();
            shopflowKeys.forEach(key => {
                const value = localStorage.getItem(key);
                size += (key.length + value.length) * 2; // rough estimate in bytes
            });
            return (size / 1024).toFixed(2); // convert to KB
        }

        function loadStats() {
            const shopflowKeys = getShopflowKeys();
            document.getElementById('totalKeys').textContent = localStorage.length;
            document.getElementById('shopflowKeys').textContent = shopflowKeys.length;
            document.getElementById('dataSize').textContent = calculateSize() + ' KB';

            // Display keys
            const keysList = document.getElementById('keysList');
            if (shopflowKeys.length === 0) {
                keysList.innerHTML = '<div class="empty-state">✨ No ShopFlow data found in localStorage</div>';
            } else {
                keysList.innerHTML = shopflowKeys.map(key => {
                    const value = localStorage.getItem(key);
                    const itemSize = ((key.length + value.length) * 2 / 1024).toFixed(2);
                    return `<div class="key-item">${key} <span style="color: #a0aec0;">(${itemSize} KB)</span></div>`;
                }).join('');
            }
        }

        function showAlert(message, type = 'success') {
            const alert = document.getElementById('alert');
            alert.textContent = message;
            alert.className = `alert ${type}`;
            alert.style.display = 'block';

            setTimeout(() => {
                alert.style.display = 'none';
            }, 5000);
        }

        function clearShopflowData() {
            const shopflowKeys = getShopflowKeys();

            if (shopflowKeys.length === 0) {
                showAlert('No ShopFlow data to clear!', 'info');
                return;
            }

            if (confirm(`Are you sure you want to clear ${shopflowKeys.length} localStorage keys?\n\nThis will remove:\n${shopflowKeys.join('\n')}`)) {
                shopflowKeys.forEach(key => {
                    localStorage.removeItem(key);
                });

                loadStats();
                showAlert(`✅ Successfully cleared ${shopflowKeys.length} localStorage keys!`);
            }
        }

        // Load stats on page load
        loadStats();

        // Auto-refresh every 5 seconds
        setInterval(loadStats, 5000);
    </script>
</body>

</html>
